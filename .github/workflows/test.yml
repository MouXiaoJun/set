name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: [1.23, 1.25] # 最低要求(iter.Seq) + 较新版本
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build ./...

    - name: Test (race + coverage)
      run: go test -race -coverprofile=coverage.out ./...

    - name: Fuzz HashSet (short)
      run: go test -run xxx -fuzz FuzzHashSetModel -fuzztime 10s ./

    - name: Fuzz SortedSet (short)
      run: go test -run xxx -fuzz FuzzSortedSetOrder -fuzztime 10s ./

    - name: Check test coverage
      if: success()
      run: |
        if [ -f coverage.out ]; then
          go tool cover -func=coverage.out | tail -1
        else
          echo "No coverage file generated"
        fi
